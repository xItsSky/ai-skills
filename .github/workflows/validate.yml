name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r .github/requirements-validation.txt
      - run: python .github/scripts/validate_skills.py
      - run: python -m coverage run --source=.github/scripts -m unittest discover -s .github/scripts/tests
      - run: python -m coverage report --omit='*/tests/*' --fail-under=80
